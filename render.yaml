services:
  - type: web
    name: heirloom-cookbook
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMMA_MODEL
        value: gemma2:9b
      - key: USE_OLLAMA
        value: "false"
